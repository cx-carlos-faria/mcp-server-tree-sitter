# Simple workflow that runs tests on push and pull requests.
name: Tests

on:
  push:
    branches: [main, master, CxMaster]
  pull_request:
    branches: [main, master, CxMaster]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests -v
        env:
          PYTHONPATH: ${{ github.workspace }}/src
